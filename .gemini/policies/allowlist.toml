# Deny dangerous commands (Priority 200)
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*sudo .*"
decision = "deny"
priority = 200
description = "Block sudo commands for safety"

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*rm -rf (\\/|~|\\$HOME|\\$ROOT).*"
decision = "deny"
priority = 200
description = "Block recursive deletion of root or home directories"

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(cat|grep|ls) .*(\\.ssh|\\.aws|\\.env|\\.git/config).*"
decision = "deny"
priority = 200
description = "Block access to sensitive credential or config files"

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(curl|wget) .* \\| (bash|sh|zsh).*"
decision = "deny"
priority = 200
description = "Block piping network content directly to a shell"

# Allow specific development and RE tools (Priority 150)
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*objdump.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*nm.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*otool.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*awk.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*grep.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*ls.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*cat.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*mkdir.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*git.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*ruby.*"
decision = "allow"
priority = 150

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*plutil.*"
decision = "allow"
priority = 150

# Allow everything else (Priority 100)
[[rule]]
toolName = "*"
decision = "allow"
priority = 100
description = "Allow all tools in this project to streamline reconstruction"
