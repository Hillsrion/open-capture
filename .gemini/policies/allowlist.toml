# Deny dangerous commands (Priority 200)
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*sudo .*"
decision = "deny"
priority = 200
description = "Block sudo commands for safety"

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*rm -rf (\\/|~|\\$HOME|\\$ROOT).*"
decision = "deny"
priority = 200
description = "Block recursive deletion of root or home directories"

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(cat|grep|ls) .*(\\.ssh|\\.aws|\\.env|\\.git/config).*"
decision = "deny"
priority = 200
description = "Block access to sensitive credential or config files"

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(curl|wget) .* \\| (bash|sh|zsh).*"
decision = "deny"
priority = 200
description = "Block piping network content directly to a shell"

# Allow shell commands with redirection to project files (Priority 175)
# Matches commands containing > or >> followed by a non-absolute path
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(>|>>)\\s*(?!\\/)\\S+.*"
decision = "allow"
priority = 175
description = "Allow redirection to project files (relative paths)"

# Ask user for redirection to absolute paths (Priority 170)
# Matches commands containing > or >> followed by /
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(>|>>)\\s*/.*"
decision = "ask_user"
priority = 170
description = "Ask for redirection to absolute paths"

# Allow cat and find for project files (Priority 180)
[[rule]]
toolName = "run_shell_command"
commandRegex = "^(cat|find) (?!/|\\.git|\\.ssh|\\.aws|\\.env)\\S+.*$"
decision = "allow"
priority = 180
description = "Allow cat and find for project files"

# Global Allow for all other tools (Priority 100)
[[rule]]
toolName = "*"
decision = "allow"
priority = 100
description = "Allow all tools in this project"
