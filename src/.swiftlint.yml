disabled_rules:
  - trailing_whitespace
  - identifier_name
  - function_body_length
  - type_body_length
  - file_length

opt_in_rules:
  - empty_count
  - contains_over_first_not_nil
  - force_unwrapping

line_length:
  warning: 200
  error: 300

function_parameter_count:
  warning: 10
  error: 15

included:
  - Sources

excluded:
  - .build
  - Tests
