disabled_rules:
  - trailing_whitespace
  - identifier_name
  - function_body_length
  - type_body_length
  - file_length
  - empty_count
  - cyclomatic_complexity
  - multiple_closures_with_trailing_closure
  - line_length
  - force_unwrapping
  - redundant_discardable_let
  - private_over_fileprivate
  - unused_closure_parameter
  - orphaned_doc_comment
  - unused_optional_binding
  - control_statement
  - implicit_optional_initialization
  - type_name # Allow IC_ naming convention for C1 parity
  - inclusive_language # Allow 'master' as used in C1 binary
  - large_tuple # Allow complex HSL/RGB math returns
  - for_where # Keep simple if inside for
  - shorthand_operator # Allow verbose math for clarity in kernels
  - unneeded_override # Allow keeping original class overrides
  - force_cast # Allow casts used in original patterns
  - force_try # Allow try! used in original patterns

opt_in_rules:
  - contains_over_first_not_nil

function_parameter_count:
  warning: 20
  error: 30

included:
  - Sources

excluded:
  - .build
  - Tests
